name: Automated Link Health Checker

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-checker:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,301,302,307,308
            --exclude-mail
            --exclude-all-private
            --max-concurrency 8
            --timeout 20
            --retry-wait-time 5
            docs/**/*.md
          output: ./lychee/out.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Issue for Broken Links
        if: steps.lychee.outputs.exit_code != 0 && steps.lychee.outputs.exit_code != '0'
        run: |
          if [ -s "./lychee/out.md" ]; then
            gh issue create \
              --title "🔗 Automated Link Health Report: Broken Links Detected" \
              --body-file ./lychee/out.md \
              --label "broken-link" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
